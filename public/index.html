
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>WiFi Phone</title>

<style>
*{box-sizing:border-box}
body{
margin:0;min-height:100vh;padding:22px 14px;
background:radial-gradient(circle at top,#243653,#101827 58%);
color:#f8fafc;font-family:system-ui;
display:flex;justify-content:center;align-items:center
}
.app{width:100%;max-width:410px}
.brand{text-align:center;margin-bottom:18px}
.logo{font-size:34px}
h1{margin:2px 0;font-size:25px}
.muted{color:#9eacc2;font-size:13px}
.panel{
background:#172438;border:1px solid #34445d;
border-radius:22px;padding:20px;
box-shadow:0 18px 50px #0005
}
.my-number{text-align:center;padding:10px 0 18px}
.number{font-size:30px;font-weight:750;letter-spacing:2px;margin-top:5px}
.status{text-align:center;color:#a9bad2;font-size:13px;margin:10px 0;min-height:22px}
.display{
width:100%;min-height:54px;border-radius:13px;
border:1px solid #40516b;background:#101b2c;
color:white;font-size:24px;text-align:center;
padding:10px;letter-spacing:2px
}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
button{
border:0;border-radius:14px;padding:15px 8px;
font-size:21px;font-weight:650;color:white;
background:#2b3d59;cursor:pointer
}
button:active{transform:scale(.97)}
.key small{display:block;color:#aebbd0;font-size:9px;margin-top:2px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.call{background:#16a36a}
.hang{background:#dc4352}
.secondary{background:#42516a}
.incoming{
display:none;text-align:center;margin-top:14px;
padding:17px;border-radius:17px;background:#263a56
}
.incoming strong{display:block;font-size:23px;margin:6px}
.small{font-size:14px;padding:12px}
.call-tools{display:none;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.foot{text-align:center;margin-top:14px;color:#8191a9;font-size:11px}
button:disabled{opacity:.5}
</style>
</head>

<body>
<main class="app">

<header class="brand">
<div class="logo">📞</div>
<h1>WIFI PHONE</h1>
<div class="muted">İnternet üzerinden sesli arama</div>
</header>

<section class="panel">

<div class="my-number">
<div class="muted">SANA AİT NUMARA</div>
<div class="number" id="myNumber">Yükleniyor...</div>
<div class="muted">Bu numarayı arkadaşınla paylaş</div>
</div>

<input id="dial" class="display" type="tel"
inputmode="numeric" maxlength="9" placeholder="Numara gir">

<div class="keypad" id="keypad">
<button class="key" data-key="1">1<small></small></button>
<button class="key" data-key="2">2<small>ABC</small></button>
<button class="key" data-key="3">3<small>DEF</small></button>
<button class="key" data-key="4">4<small>GHI</small></button>
<button class="key" data-key="5">5<small>JKL</small></button>
<button class="key" data-key="6">6<small>MNO</small></button>
<button class="key" data-key="7">7<small>PQRS</small></button>
<button class="key" data-key="8">8<small>TUV</small></button>
<button class="key" data-key="9">9<small>WXYZ</small></button>
<button class="key" data-key="clear">⌫<small>SİL</small></button>
<button class="key" data-key="0">0<small>+</small></button>
<button class="key" data-key="clearall">C<small>TEMİZLE</small></button>
</div>

<div class="actions">
<button id="callBtn" class="call">📞 Ara</button>
<button id="hangBtn" class="hang" disabled>✕ Kapat</button>
</div>

<div class="status" id="status">Sunucuya bağlanılıyor...</div>

<div class="incoming" id="incoming">
<div class="muted">GELEN ARAMA</div>
<strong id="callerNumber"></strong>
<div class="actions">
<button id="acceptBtn" class="call small">✓ Kabul et</button>
<button id="rejectBtn" class="hang small">✕ Reddet</button>
</div>
</div>

<div class="call-tools" id="callTools">
<button id="muteBtn" class="secondary small">🎙️ Mikrofonu kapat</button>
<button id="speakerBtn" class="secondary small">🔊 Ses bilgisi</button>
</div>

</section>

<div class="foot">
Mikrofon izni gerekir. İnternet bağlantısı açık olmalıdır.
Acil aramalar için kullanılmaz.
</div>
</main>

<script src="/socket.io/socket.io.js"></script>

<script>
const $=id=>document.getElementById(id);

let token=localStorage.getItem("wifiPhoneToken");
let socket,pc,localStream;
let currentCallId=null,incomingOffer=null;
let muted=false;

const rtcConfig={
iceServers:[
{urls:"stun:stun.l.google.com:19302"}
]
};

function setStatus(msg){
$("status").textContent=msg;
}

function setBusy(busy){
$("callBtn").disabled=busy;
$("hangBtn").disabled=!busy;
}

async function register(){
try{
const response=await fetch("/api/register",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({token})
});

const data=await response.json();
if(!response.ok)throw new Error(data.error);

token=data.token;
localStorage.setItem("wifiPhoneToken",token);
$("myNumber").textContent=data.phone_number;
connectSocket();

}catch(err){
setStatus(err.message);
}
}

function connectSocket(){
socket=io({auth:{token}});

socket.on("connect",()=>{
setStatus("Çevrimiçi • Arama yapabilirsin");
});

socket.on("disconnect",()=>{
setStatus("Bağlantı kesildi...");
});

socket.on("connect_error",err=>{
setStatus("Sunucu hatası: "+err.message);
});

socket.on("incoming-call",data=>{
if(currentCallId){
socket.emit("reject-call",{callId:data.callId});
return;
}

currentCallId=data.callId;
incomingOffer=data.offer;

$("callerNumber").textContent=data.fromNumber;
$("incoming").style.display="block";
setStatus("Gelen arama...");
});

socket.on("calling",({callId})=>{
currentCallId=callId;
setStatus("Karşı tarafın telefonu çalıyor...");
});

socket.on("call-answered",async({callId,answer})=>{
if(callId!==currentCallId||!pc)return;
await pc.setRemoteDescription(answer);
setStatus("Görüşme başladı");
$("callTools").style.display="grid";
});

socket.on("call-rejected",()=>{
cleanup("Arama reddedildi");
});

socket.on("call-ended",()=>{
cleanup("Arama sona erdi");
});

socket.on("call-error",message=>{
cleanup(message);
});
}

async function getMicrophone(){
if(!navigator.mediaDevices?.getUserMedia){
throw new Error("Mikrofon için HTTPS gerekir.");
}
return navigator.mediaDevices.getUserMedia({
audio:true,video:false
});
}

function waitForIceGathering(peer){
if(peer.iceGatheringState==="complete"){
return Promise.resolve();
}

return new Promise(resolve=>{
const check=()=>{
if(peer.iceGatheringState==="complete"){
peer.removeEventListener("icegatheringstatechange",check);
resolve();
}
};

peer.addEventListener("icegatheringstatechange",check);

setTimeout(()=>{
peer.removeEventListener("icegatheringstatechange",check);
resolve();
},7000);
});
}

function createPeer(){
pc=new RTCPeerConnection(rtcConfig);

pc.ontrack=event=>{
let audio=document.getElementById("remoteAudio");

if(!audio){
audio=document.createElement("audio");
audio.id="remoteAudio";
audio.autoplay=true;
document.body.appendChild(audio);
}

audio.srcObject=event.streams[0];
audio.play().catch(()=>setStatus("Sesi başlatmak için ekrana dokun."));
};

pc.onconnectionstatechange=()=>{
if(!pc)return;

if(pc.connectionState==="connected"){
setStatus("Görüşme başladı");
$("callTools").style.display="grid";
}

if(["failed","disconnected"].includes(pc.connectionState)){
setStatus("Bağlantı kesildi veya zayıfladı.");
}
};

return pc;
}

async function startCall(){
if(!socket?.connected){
return setStatus("Sunucuya bağlı değilsin.");
}

const number=$("dial").value.replace(/\D/g,"");

if(!/^\d{9}$/.test(number)){
return setStatus("9 haneli numara gir.");
}

try{
setStatus("Mikrofon izni bekleniyor...");

localStream=await getMicrophone();
createPeer();

localStream.getTracks().forEach(track=>{
pc.addTrack(track,localStream);
});

const offer=await pc.createOffer();
await pc.setLocalDescription(offer);
await waitForIceGathering(pc);

socket.emit("call-user",{
to:number,
offer:pc.localDescription
});

setBusy(true);

}catch(err){
cleanup("Arama başlatılamadı: "+err.message);
}
}

async function acceptCall(){
try{
$("incoming").style.display="none";

localStream=await getMicrophone();
createPeer();

localStream.getTracks().forEach(track=>{
pc.addTrack(track,localStream);
});

await pc.setRemoteDescription(incomingOffer);

const answer=await pc.createAnswer();
await pc.setLocalDescription(answer);
await waitForIceGathering(pc);

socket.emit("answer-call",{
callId:currentCallId,
answer:pc.localDescription
});

incomingOffer=null;
setBusy(true);
setStatus("Arama bağlanıyor...");

}catch(err){
cleanup("Arama kabul edilemedi: "+err.message);
}
}

function rejectCall(){
if(currentCallId){
socket.emit("reject-call",{callId:currentCallId});
}
cleanup("Arama reddedildi");
}

function hangUp(){
if(currentCallId){
socket.emit("end-call",{callId:currentCallId});
}
cleanup("Arama kapatıldı");
}

function cleanup(message){
if(pc){
pc.close();
pc=null;
}

if(localStream){
localStream.getTracks().forEach(t=>t.stop());
localStream=null;
}

const audio=$("remoteAudio");
if(audio){
audio.srcObject=null;
audio.remove();
}

currentCallId=null;
incomingOffer=null;
muted=false;

$("incoming").style.display="none";
$("callTools").style.display="none";
$("muteBtn").textContent="🎙️ Mikrofonu kapat";

setBusy(false);
setStatus(message);
}

$("keypad").addEventListener("click",event=>{
const key=event.target.closest("button")?.dataset.key;
if(!key)return;

if(key==="clear"){
$("dial").value=$("dial").value.slice(0,-1);
}else if(key==="clearall"){
$("dial").value="";
}else if($("dial").value.length<9){
$("dial").value+=key;
}
});

$("dial").addEventListener("input",()=>{
$("dial").value=$("dial").value.replace(/\D/g,"").slice(0,9);
});

$("callBtn").addEventListener("click",startCall);
$("hangBtn").addEventListener("click",hangUp);
$("acceptBtn").addEventListener("click",acceptCall);
$("rejectBtn").addEventListener("click",rejectCall);

$("muteBtn").addEventListener("click",()=>{
if(!localStream)return;

muted=!muted;

localStream.getAudioTracks().forEach(track=>{
track.enabled=!muted;
});

$("muteBtn").textContent=muted
?"🎙️ Mikrofonu aç"
:"🎙️ Mikrofonu kapat";
});

$("speakerBtn").addEventListener("click",()=>{
setStatus("Ses telefonunun medya ses düzeyinden ayarlanır.");
});

register();
</script>
</body>
  </html>
